<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SimplyGo Moveable Transit Kiosk (Module 1) — Interactive 3D Simulation</title>

  <!-- Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js r128 & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b121e;
      color: #f8fafc;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* Translucent Glassmorphism HUD Surfaces */
    .glass-panel {
      background: rgba(15, 23, 36, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 12px 34px -8px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Active Step Pulse Ring */
    @keyframes stepPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 150, 136, 0.55); }
      50% { box-shadow: 0 0 0 6px rgba(0, 150, 136, 0); }
    }
    .step-active-glow {
      animation: stepPulse 1.8s infinite ease-in-out;
    }

    /* Tooltip styling for raycast hover */
    #hover-tooltip {
      position: fixed;
      z-index: 30;
      pointer-events: none;
      transform: translate(-50%, -135%);
      transition: opacity 0.15s ease;
    }
  </style>
</head>
<body>
  <!-- Full-Viewport 3D WebGL Container -->
  <div id="canvas-container" aria-label="3D SimplyGo Moveable Transit Kiosk Simulation"></div>

  <!-- 3D Raycast Hover Tooltip -->
  <div id="hover-tooltip" class="glass-panel rounded-xl px-3 py-1.5 text-xs font-semibold text-teal-200 opacity-0 whitespace-nowrap border-teal-400/40">
    Interactive Part
  </div>

  <!-- Top HUD: Branding, Utility Buttons & 4 Quick-View Camera Presets -->
  <header class="fixed top-3 left-3 right-3 z-20 pointer-events-none flex flex-col lg:flex-row lg:items-center lg:justify-between gap-2.5">
    <!-- Title Card -->
    <div class="glass-panel pointer-events-auto rounded-2xl px-4 py-2.5 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#009688] to-[#00695c] flex items-center justify-center border border-teal-300/40 shadow-inner shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="4" y="2" width="16" height="20" rx="3" />
            <rect x="7" y="6" width="10" height="6" rx="1" />
            <path d="M8 16h8M10 19h4" stroke-linecap="round" />
          </svg>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-bold tracking-tight text-white truncate">
            SimplyGo Moveable Transit Kiosk
          </h1>
          <div class="flex items-center gap-2 text-[11px] text-slate-300">
            <span class="inline-block w-2 h-2 rounded-full bg-teal-400"></span>
            <span class="truncate">Module 1 &bull; Click 3D parts or use step controls</span>
          </div>
        </div>
      </div>

      <!-- Utility Controls: Audio Mute & Reset -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-reset" title="Reset Simulation"
          class="px-2.5 py-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-600/40 text-xs font-medium flex items-center gap-1.5 transition-colors cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M3 3v5h5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="hidden sm:inline">Reset</span>
        </button>
        <button id="btn-audio" title="Mute / Unmute Sound"
          class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-teal-300 border border-slate-600/40 transition-colors cursor-pointer">
          <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z" />
            <path d="M15.54 8.46a5 5 0 010 7.07M19.07 4.93a10 10 0 010 14.14" stroke-linecap="round" />
          </svg>
          <svg id="icon-sound-off" class="w-4 h-4 hidden text-rose-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M11 5L6 9H2v6h4l5 4V5z" />
            <path d="M23 9l-6 6M17 9l6 6" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>

    <!-- 4 Preset Quick-View Camera Buttons -->
    <nav class="glass-panel pointer-events-auto rounded-2xl p-1.5 flex items-center gap-1 overflow-x-auto no-scrollbar" aria-label="Camera Presets">
      <button data-view="front" class="cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-[#00897B] text-white shadow-sm">
        Front Kiosk View
      </button>
      <button data-view="screen27" class="cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer text-slate-200 hover:bg-slate-700/60">
        Zoom 27&quot; Screen
      </button>
      <button data-view="numpadSlot" class="cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer text-slate-200 hover:bg-slate-700/60">
        Zoom 13&quot; Numpad &amp; Slot
      </button>
      <button data-view="mobility" class="cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer text-slate-200 hover:bg-slate-700/60">
        Side Mobility &amp; Casters
      </button>
      <button data-view="rearThermal" class="cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer text-slate-200 hover:bg-slate-700/60">
        Rear Thermal &amp; Filter
      </button>
    </nav>
  </header>

  <!-- Live Status Toast Notification -->
  <div id="toast" class="fixed top-28 sm:top-24 left-1/2 -translate-x-1/2 z-30 glass-panel rounded-2xl px-4 py-2.5 text-xs sm:text-sm font-medium text-white flex items-center gap-2.5 transition-all duration-300 opacity-0 -translate-y-2 pointer-events-none border-teal-400/40">
    <span id="toast-dot" class="w-2.5 h-2.5 rounded-full bg-teal-400 shrink-0"></span>
    <span id="toast-msg">Ready for training simulation</span>
  </div>

  <!-- Bottom Floating Step-by-Step Interactive User Flow HUD -->
  <footer class="fixed bottom-3 left-3 right-3 z-20 pointer-events-none flex flex-col items-center gap-2">
    <!-- Current Prompt Banner -->
    <div id="flow-banner" class="glass-panel pointer-events-auto rounded-xl px-4 py-1.5 text-xs text-slate-200 flex items-center gap-2">
      <span class="font-bold text-teal-300 uppercase tracking-wider text-[10px]">Current Step</span>
      <span class="text-slate-500">|</span>
      <span id="flow-instruction" class="font-medium text-white">Place your SimplyGo transit card flat on the NFC cradle tray.</span>
    </div>

    <!-- Step Action Buttons -->
    <div class="glass-panel pointer-events-auto rounded-2xl p-2 flex items-center gap-1.5 overflow-x-auto no-scrollbar max-w-full">
      <button id="btn-step-1" data-step="1"
        class="step-btn step-active-glow px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 bg-[#00897B] hover:bg-[#009688] text-white border border-teal-300/40 transition-all cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center text-[11px] font-bold">1</span>
        <span>Place Card on Tray</span>
      </button>

      <button id="btn-step-2" data-step="2"
        class="step-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 border border-slate-600/40 transition-all cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[11px] font-bold">2</span>
        <span>Select Top-Up Mode</span>
      </button>

      <button id="btn-step-3" data-step="3"
        class="step-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 border border-slate-600/40 transition-all cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[11px] font-bold">3</span>
        <span>Key-in +$10</span>
      </button>

      <button id="btn-step-4" data-step="4"
        class="step-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 border border-slate-600/40 transition-all cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[11px] font-bold">4</span>
        <span>Insert Cash ($10)</span>
      </button>

      <button id="btn-step-5" data-step="5"
        class="step-btn px-3.5 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-2 bg-slate-800/75 hover:bg-slate-700/80 text-slate-300 border border-slate-600/40 transition-all cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-slate-700 flex items-center justify-center text-[11px] font-bold">5</span>
        <span>Take Card</span>
      </button>
    </div>
  </footer>

  <!-- Modular 3D Application Script -->
  <script>
    (function () {
      'use strict';

      /* =========================================================================
       * 1. CONSTANTS, DIMENSIONS & CAMERA PRESETS
       * ========================================================================= */
      const PALETTE = {
        tealPrimary: 0x008b82,
        tealBright: 0x009688,
        tealDark: 0x00695c,
        silverBody: 0xc8ced6,
        silverBay: 0xd8dde3,
        silverInset: 0xa6afb9,
        basePlinth: 0x68707a,
        nfcBlue: 0x1967b8,
        nfcBlueDark: 0x104a88,
        slotNavy: 0x14263b,
        charcoal: 0x242a32,
        charcoalLight: 0x353d47,
        bezelBlack: 0x13171d,
        steel: 0xcbd5e1,
        chrome: 0xe2e8f0,
        emeraldLed: 0x10b981,
        brakeRed: 0xdc2626
      };

      // Proportional freestanding kiosk dimensions (approx. 1.04m W x 0.68m D x 1.78m H)
      const KIOSK = {
        width: 1.04,
        depth: 0.68,
        height: 1.78,
        skirtClearance: 0.065, // Raised 65mm above ground Y=0 on heavy-duty casters
        frontZ: 0.34
      };

      // 5 Preset Camera Views with smooth cubic ease-in-out tweening
      const CAMERA_PRESETS = {
        front: {
          pos: new THREE.Vector3(0.0, 1.22, 2.68),
          target: new THREE.Vector3(0.0, 0.98, 0.05)
        },
        screen27: {
          pos: new THREE.Vector3(-0.18, 1.25, 1.28),
          target: new THREE.Vector3(-0.18, 1.21, 0.32)
        },
        numpadSlot: {
          pos: new THREE.Vector3(0.32, 1.28, 1.22),
          target: new THREE.Vector3(0.29, 1.15, 0.36)
        },
        mobility: {
          pos: new THREE.Vector3(1.92, 0.86, 1.38),
          target: new THREE.Vector3(0.0, 0.62, -0.02)
        },
        rearThermal: {
          pos: new THREE.Vector3(-1.35, 1.12, -2.05),
          target: new THREE.Vector3(0.0, 0.72, -0.32)
        }
      };

      // Simulation Flow States
      const FLOW = {
        IDLE: 0,
        CARD_PLACED: 1,
        TOPUP_SELECTED: 2,
        AMOUNT_ENTERED: 3,
        CASH_INSERTING: 3.5,
        TOPUP_SUCCESS: 4,
        COMPLETED: 5
      };

      /* =========================================================================
       * 2. WEB AUDIO API SYNTHESIZER (100% Offline, No External Audio Files)
       * ========================================================================= */
      class KioskAudioEngine {
        constructor() {
          this.ctx = null;
          this.muted = false;
        }

        ensureContext() {
          if (this.muted) return null;
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return this.ctx;
          } catch (err) {
            console.warn('Web Audio API unavailable:', err);
            return null;
          }
        }

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        }

        /** Step 1: Authentic high-pitch Singapore MRT card detection beep (~1850Hz) */
        playCardDetectBeep() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1850, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.18, now + 0.008);
          gain.gain.setValueAtTime(0.18, now + 0.095);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.15);
        }

        /** Step 2 & 3: Soft touchscreen tap click */
        playSoftClick(pitch = 950) {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(pitch, now);
          osc.frequency.exponentialRampToValueAtTime(pitch * 1.35, now + 0.045);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.12, now + 0.006);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.075);
        }

        /** Step 4: Mechanical roller intake rustle (filtered noise + low motor hum) + cash receipt chime */
        playCashIntakeSequence() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const intakeDur = 1.05;

          // 1. Paper rustle via bandpass-filtered white noise
          const bufferSize = Math.floor(ctx.sampleRate * intakeDur);
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * 0.6;
          }

          const noise = ctx.createBufferSource();
          noise.buffer = noiseBuffer;

          const bandpass = ctx.createBiquadFilter();
          bandpass.type = 'bandpass';
          bandpass.frequency.setValueAtTime(1400, now);
          bandpass.frequency.linearRampToValueAtTime(2200, now + intakeDur);
          bandpass.Q.value = 1.8;

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.001, now);
          noiseGain.gain.linearRampToValueAtTime(0.14, now + 0.08);
          noiseGain.gain.setValueAtTime(0.12, now + intakeDur - 0.15);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + intakeDur);

          noise.connect(bandpass);
          bandpass.connect(noiseGain);
          noiseGain.connect(ctx.destination);
          noise.start(now);
          noise.stop(now + intakeDur);

          // 2. Low mechanical roller motor whir
          const motorOsc = ctx.createOscillator();
          const motorGain = ctx.createGain();
          motorOsc.type = 'sawtooth';
          motorOsc.frequency.setValueAtTime(135, now);
          motorOsc.frequency.linearRampToValueAtTime(155, now + intakeDur * 0.5);
          motorOsc.frequency.linearRampToValueAtTime(125, now + intakeDur);

          const lowpass = ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.value = 340;

          motorGain.gain.setValueAtTime(0.001, now);
          motorGain.gain.linearRampToValueAtTime(0.07, now + 0.08);
          motorGain.gain.setValueAtTime(0.07, now + intakeDur - 0.12);
          motorGain.gain.exponentialRampToValueAtTime(0.001, now + intakeDur);

          motorOsc.connect(lowpass);
          lowpass.connect(motorGain);
          motorGain.connect(ctx.destination);
          motorOsc.start(now);
          motorOsc.stop(now + intakeDur);

          // 3. Positive cash-receipt chime right after roller stops
          const chimeStart = now + intakeDur + 0.05;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1318.5, chimeStart); // E6
          g.gain.setValueAtTime(0.001, chimeStart);
          g.gain.linearRampToValueAtTime(0.15, chimeStart + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, chimeStart + 0.25);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(chimeStart);
          osc.stop(chimeStart + 0.27);
        }

        /** Step 5: Authentic two-tone Singapore MRT success/departure chime */
        playSuccessChime() {
          const ctx = this.ensureContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          const notes = [
            { freq: 783.99, start: 0.0, dur: 0.26 },   // G5
            { freq: 1046.50, start: 0.22, dur: 0.45 }  // C6
          ];
          notes.forEach(({ freq, start, dur }) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + start);
            gain.gain.setValueAtTime(0.001, now + start);
            gain.gain.linearRampToValueAtTime(0.17, now + start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + start + dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + start);
            osc.stop(now + start + dur + 0.02);
          });
        }
      }

      /* =========================================================================
       * 3. PROCEDURAL CANVAS TEXTURE GENERATORS
       * ========================================================================= */
      const CanvasTextures = {
        /** Architectural MRT Concourse Floor Tile Grid */
        createFloorTexture() {
          const c = document.createElement('canvas');
          c.width = 1024;
          c.height = 1024;
          const ctx = c.getContext('2d');

          ctx.fillStyle = '#252d3a';
          ctx.fillRect(0, 0, 1024, 1024);

          // Subtle architectural granite tile lines
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.12)';
          ctx.lineWidth = 2;
          for (let i = 0; i <= 1024; i += 128) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 1024);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(1024, i);
            ctx.stroke();
          }

          // Micro speckle for realistic terrazzo concourse floor
          ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
          for (let i = 0; i < 650; i++) {
            ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
          }

          const tex = new THREE.CanvasTexture(c);
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(7, 7);
          tex.anisotropy = 8;
          return tex;
        },

        /** Backlit Header Plate: "SimplyGo / Top-Up Kiosk" */
        createHeaderPlateTexture() {
          const c = document.createElement('canvas');
          c.width = 1024;
          c.height = 256;
          const ctx = c.getContext('2d');

          // Translucent white-teal backlit gradient
          const grad = ctx.createLinearGradient(0, 0, 1024, 256);
          grad.addColorStop(0, '#e0f7f4');
          grad.addColorStop(0.5, '#ffffff');
          grad.addColorStop(1, '#d1f2eb');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, 1024, 256);

          // Left SimplyGo emblem badge
          ctx.fillStyle = '#00897b';
          ctx.beginPath();
          ctx.roundRect(42, 46, 164, 164, 34);
          ctx.fill();

          // Stylized white contactless wave icon inside badge
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 10;
          ctx.lineCap = 'round';
          [26, 46, 66].forEach((r) => {
            ctx.beginPath();
            ctx.arc(112, 128, r, -0.7, 0.7);
            ctx.stroke();
          });
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(96, 128, 10, 0, Math.PI * 2);
          ctx.fill();

          // Main Title
          ctx.fillStyle = '#00695c';
          ctx.font = '800 76px Inter, sans-serif';
          ctx.fillText('SimplyGo', 236, 128);

          // Divider slash & subtitle
          ctx.fillStyle = '#0f172a';
          ctx.font = '700 44px Inter, sans-serif';
          ctx.fillText('Top-Up Kiosk', 238, 188);

          // Right accent pill
          ctx.fillStyle = '#00897b';
          ctx.beginPath();
          ctx.roundRect(755, 92, 224, 72, 36);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = '700 26px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('MRT • BUS', 867, 138);

          const tex = new THREE.CanvasTexture(c);
          tex.anisotropy = 4;
          return tex;
        },

        /** Banknote Slot Decal Label: "Insert Notes Face Up (SGD 2, 5, 10, 50)" */
        createBanknoteLabelTexture() {
          const c = document.createElement('canvas');
          c.width = 512;
          c.height = 140;
          const ctx = c.getContext('2d');

          ctx.fillStyle = '#14263b';
          ctx.fillRect(0, 0, 512, 140);

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 32px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Insert Notes Face Up', 256, 62);

          ctx.fillStyle = '#7dd3fc';
          ctx.font = '700 24px Inter, sans-serif';

      /* =========================================================================
       * 4. 3D KIOSK ARCHITECTURE BUILDER (Procedural PBR MeshStandardMaterial)
       * ========================================================================= */
      class SimplyGoKioskBuilder {
        constructor(scene) {
          this.scene = scene;
          this.interactables = [];
          this.refs = {};
        }

        registerInteractable(obj, actionId, tooltipText) {
          obj.traverse((child) => {
            if (child.isMesh) {
              child.userData.actionId = actionId;
              child.userData.tooltipText = tooltipText;
              this.interactables.push(child);
            }
          });
        }

        buildEnvironment() {
          // Hemisphere + Ambient station lighting
          const hemi = new THREE.HemisphereLight(0xf1f5f9, 0x1e293b, 0.72);
          hemi.position.set(0, 8, 0);
          this.scene.add(hemi);

          const ambient = new THREE.AmbientLight(0xdbeafe, 0.25);
          this.scene.add(ambient);

          // Main overhead directional station light casting crisp soft contact shadows
          const keyLight = new THREE.DirectionalLight(0xffffff, 0.95);
          keyLight.position.set(2.8, 5.4, 3.6);
          keyLight.castShadow = true;
          keyLight.shadow.mapSize.width = 2048;
          keyLight.shadow.mapSize.height = 2048;
          keyLight.shadow.camera.near = 0.5;
          keyLight.shadow.camera.far = 16;
          keyLight.shadow.camera.left = -2.8;
          keyLight.shadow.camera.right = 2.8;
          keyLight.shadow.camera.top = 2.8;
          keyLight.shadow.camera.bottom = -2.8;
          keyLight.shadow.bias = -0.0004;
          this.scene.add(keyLight);

          // Cool rim/back light so rear service panel & side casters read cleanly
          const backLight = new THREE.DirectionalLight(0x93c5fd, 0.52);
          backLight.position.set(-2.5, 3.2, -3.5);
          this.scene.add(backLight);

          // Subtle side fill light for caster inspection
          const sideFill = new THREE.DirectionalLight(0xe2e8f0, 0.32);
          sideFill.position.set(3.2, 1.4, -0.5);
          this.scene.add(sideFill);

          // Architectural MRT Concourse Floor at Y = 0
          const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(16, 16),
            new THREE.MeshStandardMaterial({
              map: CanvasTextures.createFloorTexture(),
              roughness: 0.72,
              metalness: 0.14
            })
          );
          floor.rotation.x = -Math.PI / 2;
          floor.receiveShadow = true;
          this.scene.add(floor);

          // Subtle architectural floor demarcation ring around moveable kiosk footprint
          const ringMat = new THREE.MeshBasicMaterial({
            color: PALETTE.tealBright,
            transparent: true,
            opacity: 0.28,
            side: THREE.DoubleSide
          });
          const ring = new THREE.Mesh(new THREE.RingGeometry(0.86, 0.885, 64), ringMat);
          ring.rotation.x = -Math.PI / 2;
          ring.position.y = 0.003;
          this.scene.add(ring);
        }

        buildKiosk() {
          const kioskGroup = new THREE.Group();
          this.scene.add(kioskGroup);

          // Shared PBR Materials matching the architectural reference drawings
          const silverBodyMat = new THREE.MeshStandardMaterial({
            color: PALETTE.silverBody,
            roughness: 0.34,
            metalness: 0.55
          });
          const silverBayMat = new THREE.MeshStandardMaterial({
            color: PALETTE.silverBay,
            roughness: 0.32,
            metalness: 0.48
          });
          const silverInsetMat = new THREE.MeshStandardMaterial({
            color: PALETTE.silverInset,
            roughness: 0.42,
            metalness: 0.45
          });
          const basePlinthMat = new THREE.MeshStandardMaterial({
            color: PALETTE.basePlinth,
            roughness: 0.48,
            metalness: 0.45
          });
          const tealMat = new THREE.MeshStandardMaterial({
            color: PALETTE.tealPrimary,
            roughness: 0.32,
            metalness: 0.18
          });
          const charcoalMat = new THREE.MeshStandardMaterial({
            color: PALETTE.charcoal,
            roughness: 0.52,
            metalness: 0.3
          });
          const steelMat = new THREE.MeshStandardMaterial({
            color: PALETTE.steel,
            roughness: 0.24,
            metalness: 0.82
          });
          const bezelMat = new THREE.MeshStandardMaterial({
            color: PALETTE.bezelBlack,
            roughness: 0.38,
            metalness: 0.35
          });
          const seamMat = new THREE.MeshStandardMaterial({
            color: 0x1c222a,
            roughness: 0.65,
            metalness: 0.2
          });
          const whiteStripeMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.26,
            metalness: 0.1,
            emissive: 0xffffff,
            emissiveIntensity: 0.1
          });

          /* -------------------------------------------------------------------
           * A. WEIGHTED LOW ANTI-TIP MOBILE BASE PLINTH (65mm floor clearance)
           * ------------------------------------------------------------------- */
          const plinthW = KIOSK.width + 0.10;
          const plinthD = KIOSK.depth + 0.10;
          const plinthR = 0.08;
          const plinthShape = new THREE.Shape();
          const pw = plinthW / 2;
          const pd = plinthD / 2;
          plinthShape.moveTo(-pw + plinthR, -pd);
          plinthShape.lineTo(pw - plinthR, -pd);
          plinthShape.absarc(pw - plinthR, -pd + plinthR, plinthR, -Math.PI / 2, 0, false);
          plinthShape.lineTo(pw, pd - plinthR);

      /* =========================================================================
       * 5. SMOOTH CAMERA CONTROLLER (Cubic Ease-In-Out Tweening)
       * ========================================================================= */
      class CameraController {
        constructor(camera, controls) {
          this.camera = camera;
          this.controls = controls;
          this.tween = null;

          this.controls.addEventListener('start', () => {
            this.tween = null;
          });
        }

        flyTo(presetKey, duration = 850) {
          const preset = CAMERA_PRESETS[presetKey];
          if (!preset) return;
          this.tween = {
            startPos: this.camera.position.clone(),
            endPos: preset.pos.clone(),
            startTarget: this.controls.target.clone(),
            endTarget: preset.target.clone(),
            startTime: performance.now(),
            duration
          };
        }

        update(now) {
          if (this.tween) {
            const elapsed = now - this.tween.startTime;
            let t = Math.min(1, elapsed / this.tween.duration);
            t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

            this.camera.position.lerpVectors(this.tween.startPos, this.tween.endPos, t);
            this.controls.target.lerpVectors(this.tween.startTarget, this.tween.endTarget, t);

            if (elapsed >= this.tween.duration) {
              this.tween = null;
            }
          }
          this.controls.update();
        }
      }

      /* =========================================================================
       * 6. MAIN SIMULATION CONTROLLER (State Machine + Raycast + Animations)
       * ========================================================================= */
      class SimplyGoSimulationApp {
        constructor() {
          this.container = document.getElementById('canvas-container');
          this.tooltip = document.getElementById('hover-tooltip');
          this.audio = new KioskAudioEngine();
          this.raycaster = new THREE.Raycaster();
          this.pointer = new THREE.Vector2();
          this.downPos = { x: 0, y: 0 };

          this.state = FLOW.IDLE;
          this.cardAnim = null;
          this.billAnim = null;
          this.irFlashUntil = 0;
          this.toastTimer = null;

          this.initThree();
          this.builder = new SimplyGoKioskBuilder(this.scene);
          this.builder.buildEnvironment();
          this.builder.buildKiosk();

          this.camCtrl = new CameraController(this.camera, this.controls);

          this.bindHUD();
          this.bindCanvasInteraction();
          this.updateFlowUI();
          this.onResize();
        }

        initThree() {
          this.scene = new THREE.Scene();
          this.scene.background = new THREE.Color(0x0f172a);
          this.scene.fog = new THREE.FogExp2(0x0f172a, 0.065);

          const w = this.container.clientWidth || window.innerWidth;
          const h = this.container.clientHeight || window.innerHeight;

          this.camera = new THREE.PerspectiveCamera(40, w / h, 0.05, 50);
          this.camera.position.copy(CAMERA_PRESETS.front.pos);

          this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
          this.renderer.setSize(w, h);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.shadowMap.enabled = true;
          this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          this.renderer.outputEncoding = THREE.sRGBEncoding;
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1.1;
          this.container.appendChild(this.renderer.domElement);

          this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.07;
          this.controls.minDistance = 0.72;
          this.controls.maxDistance = 5.5;
          this.controls.maxPolarAngle = Math.PI / 2 - 0.02;
          this.controls.target.copy(CAMERA_PRESETS.front.target);
          this.controls.update();
        }

        /* ---------------- Step-by-Step User Flow Actions ---------------- */

        executeStep1PlaceCard() {
          if (this.state !== FLOW.IDLE && this.state !== FLOW.COMPLETED) return;
          const nfc = this.builder.refs.nfc;
          this.state = FLOW.CARD_PLACED;

          this.cardAnim = {
            startPos: nfc.transitCard.position.clone(),
            endPos: nfc.cardTrayPos.clone(),
            startRot: nfc.transitCard.rotation.clone(),
            endRot: nfc.cardTrayRot.clone(),
            startTime: performance.now(),
            duration: 520,
            onDone: () => {
              this.audio.playCardDetectBeep();
              CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.CARD_PLACED);
              this.showToast('Card Detected — Current Balance: $3.50', 'bg-teal-400');
              this.updateFlowUI();
            }
          };
          this.updateFlowUI();
        }

        executeStep2SelectTopUp() {
          if (this.state !== FLOW.CARD_PLACED) {
            this.showToast('First place your transit card on the NFC tray (Step 1).', 'bg-amber-400');
            return;
          }
          this.state = FLOW.TOPUP_SELECTED;
          this.audio.playSoftClick(920);
          CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.TOPUP_SELECTED);
          CanvasTextures.renderNumpad13Screen(this.builder.refs.numpad13, FLOW.TOPUP_SELECTED);
          this.showToast('Top-Up Mode Selected — 13" Tilted Numpad Illuminated', 'bg-teal-400');
          this.updateFlowUI();
        }

        executeStep3KeyInAmount() {
          if (this.state !== FLOW.TOPUP_SELECTED) {
            this.showToast('Select "Top-Up Stored Value" on the 27" screen first (Step 2).', 'bg-amber-400');
            return;
          }
          this.state = FLOW.AMOUNT_ENTERED;
          this.audio.playSoftClick(1160);
          this.builder.refs.banknoteSlot.fastPulse = true;
          CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.AMOUNT_ENTERED);
          CanvasTextures.renderNumpad13Screen(this.builder.refs.numpad13, FLOW.AMOUNT_ENTERED);
          this.showToast('Amount $10.00 Selected — Banknote Slot Flashing Fast', 'bg-emerald-400');
          this.updateFlowUI();
        }

        executeStep4InsertCash() {
          if (this.state !== FLOW.AMOUNT_ENTERED) {
            this.showToast('Key-in +$10 on the 13" numpad first (Step 3).', 'bg-amber-400');
            return;
          }
          this.state = FLOW.CASH_INSERTING;
          const slot = this.builder.refs.banknoteSlot;
          slot.banknote.visible = true;
          slot.banknote.position.set(0, -0.008, 0.145);

          CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.CASH_INSERTING);
          this.audio.playCashIntakeSequence();
          this.showToast('Feeding SGD $10 Note — Optical IR Sensor Writing Balance...', 'bg-emerald-400');

          this.billAnim = {
            startZ: 0.145,
            endZ: -0.055,
            startTime: performance.now(),
            duration: 1120,
            onDone: () => {
              slot.banknote.visible = false;
              slot.fastPulse = false;
              this.irFlashUntil = performance.now() + 900;

              // Automatically advance to Step 5 Ready: Card Updated!
              this.state = FLOW.TOPUP_SUCCESS;
              CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.TOPUP_SUCCESS);
              CanvasTextures.renderNumpad13Screen(this.builder.refs.numpad13, FLOW.TOPUP_SUCCESS);
              this.audio.playSuccessChime();
              this.showToast('Top-Up Successful! New Balance: $13.50 — Collect Your Card', 'bg-emerald-400');
              this.updateFlowUI();
            }
          };
          this.updateFlowUI();
        }

        executeStep5TakeCard() {
          if (this.state !== FLOW.TOPUP_SUCCESS) {
            this.showToast('Complete cash insertion before retrieving your card (Step 4).', 'bg-amber-400');
            return;
          }
          const nfc = this.builder.refs.nfc;
          this.state = FLOW.COMPLETED;
          this.audio.playSoftClick(1280);

          this.cardAnim = {
            startPos: nfc.transitCard.position.clone(),
            endPos: nfc.cardHandPos.clone(),
            startRot: nfc.transitCard.rotation.clone(),
            endRot: nfc.cardHandRot.clone(),
            startTime: performance.now(),
            duration: 580,
            onDone: () => {
              CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.COMPLETED);
              CanvasTextures.renderNumpad13Screen(this.builder.refs.numpad13, FLOW.COMPLETED);
              this.showToast('Card Retrieved! Simulation Complete — Click Step 1 or Reset to Replay', 'bg-teal-400');
              this.updateFlowUI();
            }
          };
          this.updateFlowUI();
        }

        resetSimulation() {
          this.audio.playSoftClick(780);
          this.state = FLOW.IDLE;
          this.cardAnim = null;
          this.billAnim = null;
          this.irFlashUntil = 0;

          const nfc = this.builder.refs.nfc;
          nfc.transitCard.position.copy(nfc.cardHandPos);
          nfc.transitCard.rotation.copy(nfc.cardHandRot);

          const slot = this.builder.refs.banknoteSlot;
          slot.banknote.visible = false;
          slot.fastPulse = false;

          CanvasTextures.renderMain27Screen(this.builder.refs.main27, FLOW.IDLE);
          CanvasTextures.renderNumpad13Screen(this.builder.refs.numpad13, FLOW.IDLE);
          this.updateFlowUI();
          this.showToast('Simulation Reset to Idle State', 'bg-slate-400');
        }

        /* ---------------- HUD State Synchronization ---------------- */

        updateFlowUI() {
          const instructions = {
            [FLOW.IDLE]: 'Step 1: Place your SimplyGo transit card flat on the center NFC cradle tray.',
            [FLOW.CARD_PLACED]: 'Step 2: Tap "Top-Up Stored Value" on the 27" landscape touchscreen.',
            [FLOW.TOPUP_SELECTED]: 'Step 3: Key-in "+$10" on the 13" tilted 30° touch numpad.',
            [FLOW.AMOUNT_ENTERED]: 'Step 4: Insert the SGD $10 banknote into the flashing top-right slot.',
            [FLOW.CASH_INSERTING]: 'Processing banknote intake & writing new stored value to NFC card...',
            [FLOW.TOPUP_SUCCESS]: 'Step 5: Balance updated to $13.50! Click "Take Card" or the card to retrieve.',
            [FLOW.COMPLETED]: 'Training flow complete! Click Step 1 or Reset to run another session.'
          };
          document.getElementById('flow-instruction').textContent = instructions[this.state] || '';

          // Determine which step button is currently active/next
          let nextStep = 1;
          if (this.state === FLOW.CARD_PLACED) nextStep = 2;
          else if (this.state === FLOW.TOPUP_SELECTED) nextStep = 3;
          else if (this.state === FLOW.AMOUNT_ENTERED || this.state === FLOW.CASH_INSERTING) nextStep = 4;
          else if (this.state === FLOW.TOPUP_SUCCESS) nextStep = 5;
          else if (this.state === FLOW.COMPLETED) nextStep = 1;

          document.querySelectorAll('.step-btn').forEach((btn) => {
            const stepNum = Number(btn.dataset.step);
            const isNext = stepNum === nextStep && this.state !== FLOW.CASH_INSERTING;
            const isDone =
              (this.state === FLOW.COMPLETED) ||
              (stepNum < nextStep && this.state !== FLOW.IDLE);

            btn.classList.remove('step-active-glow', 'bg-[#00897B]', 'hover:bg-[#009688]', 'text-white', 'border-teal-300/40', 'bg-emerald-900/60', 'text-emerald-200', 'border-emerald-500/40', 'bg-slate-800/75', 'text-slate-300', 'border-slate-600/40');

            if (isNext) {
              btn.classList.add('step-active-glow', 'bg-[#00897B]', 'hover:bg-[#009688]', 'text-white', 'border-teal-300/40');
            } else if (isDone) {
              btn.classList.add('bg-emerald-900/60', 'text-emerald-200', 'border-emerald-500/40');
            } else {
              btn.classList.add('bg-slate-800/75', 'text-slate-300', 'border-slate-600/40');
            }
          });
        }

        showToast(message, dotColor = 'bg-teal-400') {
          const toast = document.getElementById('toast');
          document.getElementById('toast-msg').textContent = message;
          document.getElementById('toast-dot').className = `w-2.5 h-2.5 rounded-full ${dotColor} shrink-0`;

          toast.classList.remove('opacity-0', '-translate-y-2');
          toast.classList.add('opacity-100', 'translate-y-0');

          if (this.toastTimer) clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => {
            toast.classList.remove('opacity-100', 'translate-y-0');
            toast.classList.add('opacity-0', '-translate-y-2');
          }, 3000);
        }

        /* ---------------- Event Listeners ---------------- */

        bindHUD() {
          // Camera Preset Buttons
          document.querySelectorAll('.cam-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              this.audio.playSoftClick(860);
              const viewKey = btn.dataset.view;
              this.camCtrl.flyTo(viewKey);

              document.querySelectorAll('.cam-btn').forEach((b) => {
                const active = b === btn;
                b.className = active
                  ? 'cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer bg-[#00897B] text-white shadow-sm'
                  : 'cam-btn px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all cursor-pointer text-slate-200 hover:bg-slate-700/60';
              });
            });
          });

          // Step Action Buttons
          document.getElementById('btn-step-1').addEventListener('click', () => this.executeStep1PlaceCard());
          document.getElementById('btn-step-2').addEventListener('click', () => this.executeStep2SelectTopUp());
          document.getElementById('btn-step-3').addEventListener('click', () => this.executeStep3KeyInAmount());
          document.getElementById('btn-step-4').addEventListener('click', () => this.executeStep4InsertCash());
          document.getElementById('btn-step-5').addEventListener('click', () => this.executeStep5TakeCard());

          // Reset & Audio Mute
          document.getElementById('btn-reset').addEventListener('click', () => this.resetSimulation());
          document.getElementById('btn-audio').addEventListener('click', () => {
            const muted = this.audio.toggleMute();
            document.getElementById('icon-sound-on').classList.toggle('hidden', muted);
            document.getElementById('icon-sound-off').classList.toggle('hidden', !muted);
            this.showToast(muted ? 'Audio Muted' : 'Audio Enabled', muted ? 'bg-rose-400' : 'bg-teal-400');
          });

          window.addEventListener('resize', () => this.onResize());
        }

        bindCanvasInteraction() {
          const dom = this.renderer.domElement;

          dom.addEventListener('pointerdown', (e) => {
            this.downPos = { x: e.clientX, y: e.clientY };
          });

          dom.addEventListener('pointermove', (e) => {
            const rect = dom.getBoundingClientRect();
            this.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            this.pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            this.raycaster.setFromCamera(this.pointer, this.camera);
            const hits = this.raycaster.intersectObjects(this.builder.interactables, false);

            if (hits.length > 0) {
              dom.style.cursor = 'pointer';
              this.tooltip.textContent = hits[0].object.userData.tooltipText;
              this.tooltip.style.left = `${e.clientX}px`;
              this.tooltip.style.top = `${e.clientY}px`;
              this.tooltip.style.opacity = '1';
            } else {
              dom.style.cursor = 'grab';
              this.tooltip.style.opacity = '0';
            }
          });

          dom.addEventListener('pointerleave', () => {
            this.tooltip.style.opacity = '0';
          });

          dom.addEventListener('pointerup', (e) => {
            // Ignore orbit drag gestures
            if (Math.hypot(e.clientX - this.downPos.x, e.clientY - this.downPos.y) > 6) return;

            const rect = dom.getBoundingClientRect();
            this.pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            this.pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            this.raycaster.setFromCamera(this.pointer, this.camera);
            const hits = this.raycaster.intersectObjects(this.builder.interactables, false);
            if (hits.length === 0) return;

            const action = hits[0].object.userData.actionId;
            if (action === 'nfcTray') {
              if (this.state === FLOW.TOPUP_SUCCESS) this.executeStep5TakeCard();
              else this.executeStep1PlaceCard();
            } else if (action === 'transitCard') {
              if (this.state === FLOW.TOPUP_SUCCESS) this.executeStep5TakeCard();
              else if (this.state === FLOW.IDLE || this.state === FLOW.COMPLETED) this.executeStep1PlaceCard();
            } else if (action === 'screen27') {
              this.executeStep2SelectTopUp();
            } else if (action === 'numpad13') {
              this.executeStep3KeyInAmount();
            } else if (action === 'banknoteSlot') {
              this.executeStep4InsertCash();
            }
          });
        }

        onResize() {
          const w = this.container.clientWidth || window.innerWidth;
          const h = this.container.clientHeight || window.innerHeight;
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(w, h);
        }

        /* ---------------- Real-Time Animation Loop ---------------- */

        updateAnimations(now) {
          const sec = now * 0.001;

          // 1. Banknote Slot Flanking Ears LED Pulsing (Normal vs Fast Pulse in Step 3)
          const slot = this.builder.refs.banknoteSlot;
          if (slot) {
            const speed = slot.fastPulse ? 14.0 : 3.0;
            const pulse = 0.5 + 0.5 * Math.sin(sec * speed);
            slot.earLedMat.emissiveIntensity = slot.fastPulse ? (0.8 + pulse * 2.4) : (0.45 + pulse * 0.75);
            slot.slotLight.intensity = slot.fastPulse ? (0.45 + pulse * 1.15) : (0.25 + pulse * 0.35);
          }

          // 2. NFC Cradle Glow & Optical IR Sensor Write Flash
          const nfc = this.builder.refs.nfc;
          if (nfc) {
            if (now < this.irFlashUntil) {
              const flash = Math.sin(sec * 28) > 0;
              nfc.nfcGlowMat.emissive.setHex(flash ? 0x34d399 : 0x38bdf8);
              nfc.nfcGlowMat.emissiveIntensity = 2.4;
              nfc.nfcLight.intensity = 1.4;
            } else {
              const idlePulse = 0.5 + 0.5 * Math.sin(sec * 2.6);
              nfc.nfcGlowMat.emissive.setHex(PALETTE.tealBright);
              nfc.nfcGlowMat.emissiveIntensity = 0.55 + idlePulse * 0.45;
              nfc.nfcLight.intensity = 0.35 + idlePulse * 0.25;
            }

            // Gentle idle float when card is ready in user's hand
            if (!this.cardAnim && (this.state === FLOW.IDLE || this.state === FLOW.COMPLETED)) {
              nfc.transitCard.position.y = nfc.cardHandPos.y + Math.sin(sec * 2.4) * 0.012;
            }
          }

          // 3. Smooth Transit Card Glide Animation (Place on Tray / Lift to Hand)
          if (this.cardAnim) {
            const elapsed = now - this.cardAnim.startTime;
            let t = Math.min(1, elapsed / this.cardAnim.duration);
            const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

            const card = this.builder.refs.nfc.transitCard;
            card.position.lerpVectors(this.cardAnim.startPos, this.cardAnim.endPos, ease);
            // Slight vertical arc so card clears front tray lip naturally
            card.position.y += Math.sin(ease * Math.PI) * 0.045;

            card.rotation.set(
              THREE.MathUtils.lerp(this.cardAnim.startRot.x, this.cardAnim.endRot.x, ease),
              THREE.MathUtils.lerp(this.cardAnim.startRot.y, this.cardAnim.endRot.y, ease),
              THREE.MathUtils.lerp(this.cardAnim.startRot.z, this.cardAnim.endRot.z, ease)
            );

            if (elapsed >= this.cardAnim.duration) {
              const doneCb = this.cardAnim.onDone;
              this.cardAnim = null;
              if (doneCb) doneCb();
            }
          }

          // 4. Smooth 3D SGD $10 Banknote Roller Intake Animation
          if (this.billAnim) {
            const elapsed = now - this.billAnim.startTime;
            const t = Math.min(1, elapsed / this.billAnim.duration);
            const ease = t * t * (3 - 2 * t);
            const bill = this.builder.refs.banknoteSlot.banknote;
            bill.position.z = THREE.MathUtils.lerp(this.billAnim.startZ, this.billAnim.endZ, ease);

            if (elapsed >= this.billAnim.duration) {
              const doneCb = this.billAnim.onDone;
              this.billAnim = null;
              if (doneCb) doneCb();
            }
          }
        }

        start() {
          const animate = (now) => {
            requestAnimationFrame(animate);
            this.camCtrl.update(now);
            this.updateAnimations(now);
            this.renderer.render(this.scene, this.camera);
          };
          requestAnimationFrame(animate);
        }
      }

      /* =========================================================================
       * 7. BOOTSTRAP ON WINDOW LOAD
       * ========================================================================= */
      window.onload = function () {
        try {
          const app = new SimplyGoSimulationApp();
          app.start();
        } catch (err) {
          console.error('Failed to initialize SimplyGo Kiosk 3D Simulation:', err);
        }
      };
    })();
  </script>
</body>
</html>
